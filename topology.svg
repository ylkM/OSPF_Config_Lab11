<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .dev { fill:#e8f1fb; stroke:#2b6cb0; stroke-width:2; }
    .area { fill:#eafaf5; stroke:#2f9e6f; stroke-width:2; stroke-dasharray:6,4; }
    .label { font-size:14px; fill:#1a202c; }
    .sublabel { font-size:12px; fill:#4a5568; }
    .iface { font-size:11px; fill:#2b6cb0; }
    .link { stroke:#4a5568; stroke-width:2; }
    .wan { stroke:#c0392b; stroke-width:2; }
  </style>

  <!-- OSPF Area 0 boundary -->
  <rect x="230" y="40" width="710" height="520" class="area"/>
  <text x="850" y="65" class="label" fill="#2f9e6f" font-weight="bold">OSPF Area 0</text>

  <!-- ISPR1 -->
  <circle cx="90" cy="140" r="34" class="dev"/>
  <text x="90" y="145" text-anchor="middle" class="label">ISPR1</text>
  <text x="90" y="188" text-anchor="middle" class="sublabel">.2</text>

  <!-- R1 -->
  <circle cx="330" cy="140" r="34" class="dev"/>
  <text x="330" y="145" text-anchor="middle" class="label">R1</text>
  <text x="330" y="98" text-anchor="middle" class="sublabel">1.1.1.1/32 (Lo0)</text>

  <!-- R2 -->
  <circle cx="620" cy="140" r="34" class="dev"/>
  <text x="620" y="145" text-anchor="middle" class="label">R2</text>
  <text x="620" y="98" text-anchor="middle" class="sublabel">2.2.2.2/32 (Lo0)</text>

  <!-- R3 -->
  <circle cx="330" cy="400" r="34" class="dev"/>
  <text x="330" y="405" text-anchor="middle" class="label">R3</text>
  <text x="330" y="450" text-anchor="middle" class="sublabel">3.3.3.3/32 (Lo0)</text>

  <!-- R4 -->
  <circle cx="620" cy="400" r="34" class="dev"/>
  <text x="620" y="405" text-anchor="middle" class="label">R4</text>
  <text x="620" y="450" text-anchor="middle" class="sublabel">4.4.4.4/32 (Lo0)</text>

  <!-- SW1 -->
  <rect x="820" y="380" width="60" height="40" rx="4" class="dev"/>
  <text x="850" y="405" text-anchor="middle" class="label">SW1</text>

  <!-- PC1 -->
  <rect x="920" y="382" width="40" height="36" rx="4" class="dev"/>
  <text x="940" y="405" text-anchor="middle" class="label" font-size="12">PC1</text>
  <text x="940" y="365" text-anchor="middle" class="sublabel">.1</text>

  <!-- Links -->
  <!-- ISP - R1 (WAN, not in OSPF) -->
  <line x1="124" y1="140" x2="296" y2="140" class="wan"/>
  <text x="210" y="120" text-anchor="middle" class="sublabel">203.0.113.0/30</text>
  <text x="180" y="160" text-anchor="middle" class="iface">Gig0/0/0</text>
  <text x="270" y="160" text-anchor="middle" class="iface">Gig3/0 .1</text>

  <!-- R1 - R2 -->
  <line x1="364" y1="140" x2="586" y2="140" class="link"/>
  <text x="475" y="120" text-anchor="middle" class="sublabel">10.0.12.0/30</text>
  <text x="400" y="160" text-anchor="middle" class="iface">Gig0/0 .1</text>
  <text x="555" y="160" text-anchor="middle" class="iface">.2 Gig0/0</text>

  <!-- R1 - R3 -->
  <line x1="330" y1="174" x2="330" y2="366" class="link"/>
  <text x="270" y="270" text-anchor="middle" class="sublabel">10.0.13.0/30</text>
  <text x="360" y="200" text-anchor="middle" class="iface">Fa1/0 .1</text>
  <text x="360" y="345" text-anchor="middle" class="iface">.2 Fa1/0</text>

  <!-- R2 - R4 -->
  <line x1="620" y1="174" x2="620" y2="366" class="link"/>
  <text x="680" y="270" text-anchor="middle" class="sublabel">10.0.24.0/30</text>
  <text x="655" y="200" text-anchor="middle" class="iface">Fa1/0 .1</text>
  <text x="655" y="345" text-anchor="middle" class="iface">.2 Fa1/0</text>

  <!-- R3 - R4 -->
  <line x1="364" y1="400" x2="586" y2="400" class="link"/>
  <text x="475" y="380" text-anchor="middle" class="sublabel">10.0.34.0/30</text>
  <text x="400" y="420" text-anchor="middle" class="iface">Fa2/0 .1</text>
  <text x="555" y="420" text-anchor="middle" class="iface">.2 Fa2/0</text>

  <!-- R4 - SW1 -->
  <line x1="654" y1="400" x2="820" y2="400" class="link"/>
  <text x="730" y="380" text-anchor="middle" class="sublabel">192.168.4.0/24</text>
  <text x="700" y="420" text-anchor="middle" class="iface">Gig0/0 .254</text>

  <!-- SW1 - PC1 -->
  <line x1="880" y1="400" x2="920" y2="400" class="link"/>

  <!-- Legend -->
  <line x1="240" y1="580" x2="280" y2="580" class="wan"/>
  <text x="290" y="585" class="sublabel">WAN link (not in OSPF)</text>
  <line x1="500" y1="580" x2="540" y2="580" class="link"/>
  <text x="550" y="585" class="sublabel">LAN link (in OSPF Area 0)</text>
</svg>
