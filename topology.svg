<svg viewBox="0 0 2000 1240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .dev { fill:#e8f1fb; stroke:#2b6cb0; stroke-width:4; }
    .area { fill:#eafaf5; stroke:#2f9e6f; stroke-width:4; stroke-dasharray:12,8; }
    .label { font-size:28px; fill:#1a202c; font-weight:bold; }
    .sublabel { font-size:24px; fill:#4a5568; }
    .iface { font-size:22px; fill:#2b6cb0; }
    .link { stroke:#4a5568; stroke-width:4; }
    .wan { stroke:#c0392b; stroke-width:4; }
  </style>

  <!-- OSPF Area 0 boundary -->
  <rect x="460" y="80" width="1420" height="1040" class="area"/>
  <text x="1700" y="130" class="label" fill="#2f9e6f" font-weight="bold">OSPF Area 0</text>

  <!-- ISPR1 -->
  <circle cx="180" cy="280" r="68" class="dev"/>
  <text x="180" y="290" text-anchor="middle" class="label">ISPR1</text>
  <text x="180" y="376" text-anchor="middle" class="sublabel">.2</text>

  <!-- R1 -->
  <circle cx="660" cy="280" r="68" class="dev"/>
  <text x="660" y="290" text-anchor="middle" class="label">R1</text>
  <text x="660" y="196" text-anchor="middle" class="sublabel">1.1.1.1/32 (Lo0)</text>

  <!-- R2 -->
  <circle cx="1240" cy="280" r="68" class="dev"/>
  <text x="1240" y="290" text-anchor="middle" class="label">R2</text>
  <text x="1240" y="196" text-anchor="middle" class="sublabel">2.2.2.2/32 (Lo0)</text>

  <!-- R3 -->
  <circle cx="660" cy="800" r="68" class="dev"/>
  <text x="660" y="810" text-anchor="middle" class="label">R3</text>
  <text x="660" y="900" text-anchor="middle" class="sublabel">3.3.3.3/32 (Lo0)</text>

  <!-- R4 -->
  <circle cx="1240" cy="800" r="68" class="dev"/>
  <text x="1240" y="810" text-anchor="middle" class="label">R4</text>
  <text x="1240" y="900" text-anchor="middle" class="sublabel">4.4.4.4/32 (Lo0)</text>

  <!-- SW1 -->
  <rect x="1640" y="760" width="120" height="80" rx="8" class="dev"/>
  <text x="1700" y="810" text-anchor="middle" class="label" font-size="24">SW1</text>

  <!-- PC1 -->
  <rect x="1840" y="764" width="80" height="72" rx="8" class="dev"/>
  <text x="1880" y="810" text-anchor="middle" class="label" font-size="22">PC1</text>
  <text x="1880" y="730" text-anchor="middle" class="sublabel">.1</text>

  <!-- Links -->
  <!-- ISP - R1 (WAN, not in OSPF) -->
  <line x1="248" y1="280" x2="592" y2="280" class="wan"/>
  <text x="420" y="240" text-anchor="middle" class="sublabel">203.0.113.0/30</text>
  <text x="330" y="320" text-anchor="middle" class="iface">Gig0/0/0</text>
  <text x="540" y="320" text-anchor="middle" class="iface">Gig3/0 .1</text>

  <!-- R1 - R2 -->
  <line x1="728" y1="280" x2="1172" y2="280" class="link"/>
  <text x="950" y="240" text-anchor="middle" class="sublabel">10.0.12.0/30</text>
  <text x="800" y="320" text-anchor="middle" class="iface">Gig0/0 .1</text>
  <text x="1110" y="320" text-anchor="middle" class="iface">.2 Gig0/0</text>

  <!-- R1 - R3 -->
  <line x1="660" y1="348" x2="660" y2="732" class="link"/>
  <text x="540" y="540" text-anchor="middle" class="sublabel">10.0.13.0/30</text>
  <text x="720" y="400" text-anchor="middle" class="iface">Fa1/0 .1</text>
  <text x="720" y="690" text-anchor="middle" class="iface">.2 Fa1/0</text>

  <!-- R2 - R4 -->
  <line x1="1240" y1="348" x2="1240" y2="732" class="link"/>
  <text x="1360" y="540" text-anchor="middle" class="sublabel">10.0.24.0/30</text>
  <text x="1310" y="400" text-anchor="middle" class="iface">Fa1/0 .1</text>
  <text x="1310" y="690" text-anchor="middle" class="iface">.2 Fa1/0</text>

  <!-- R3 - R4 -->
  <line x1="728" y1="800" x2="1172" y2="800" class="link"/>
  <text x="950" y="760" text-anchor="middle" class="sublabel">10.0.34.0/30</text>
  <text x="800" y="840" text-anchor="middle" class="iface">Fa2/0 .1</text>
  <text x="1110" y="840" text-anchor="middle" class="iface">.2 Fa2/0</text>

  <!-- R4 - SW1 -->
  <line x1="1308" y1="800" x2="1640" y2="800" class="link"/>
  <text x="1460" y="760" text-anchor="middle" class="sublabel">192.168.4.0/24</text>
  <text x="1400" y="840" text-anchor="middle" class="iface">Gig0/0 .254</text>

  <!-- SW1 - PC1 -->
  <line x1="1760" y1="800" x2="1840" y2="800" class="link"/>

  <!-- Legend -->
  <line x1="480" y1="1160" x2="560" y2="1160" class="wan"/>
  <text x="580" y="1168" class="sublabel">WAN link (not in OSPF)</text>
  <line x1="1000" y1="1160" x2="1080" y2="1160" class="link"/>
  <text x="1100" y="1168" class="sublabel">LAN link (in OSPF Area 0)</text>
</svg>
